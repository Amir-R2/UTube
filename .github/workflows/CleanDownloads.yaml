name: Clean Downloads Folder

on:
  workflow_dispatch:
    description: 'Remove all files in the downloads folder'

jobs:
  clean-downloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove all files in downloads folder
        run: |
          DOWNLOAD_DIR="${{ github.event.inputs.output_folder }}"
          
          if [ -d "downloads" ]; then
            echo "Cleaning downloads folder..."
            rm -rf downloads/*
            echo "Downloads folder cleaned"
          else
            echo "Downloads folder does not exist"
          fi
          
          # Also clean up any temporary files
          rm -f .github/cookies.txt 2>/dev/null || true
          echo "Cleanup complete"

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add downloads/
          git commit -m "Clean downloads folder" || echo "No changes to commit"
          git push