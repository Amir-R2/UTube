name: Download and Split File

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Enter URL to download'
        required: true
        type: string
      quality:
        description: 'Video quality'
        required: false
        type: choice
        default: 'best'
        options:
          - 'best'
          - '720p'
          - '1080p'
      chunk_size_mb:
        description: 'Chunk size in MB'
        required: false
        type: string
        default: '95'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v5
      
      - name: Download file
        run: |
          mkdir -p downloads
          cd downloads
          
          if [[ "${{ github.event.inputs.url }}" =~ (youtube\.com|youtu\.be) ]]; then
            yt-dlp -f "best[ext=mp4]" -o "%(title)s.%(ext)s" "${{ github.event.inputs.url }}"
          else
            wget "${{ github.event.inputs.url }}"
          fi
          
          cd ..
      
      - name: Split and push
        run: |
          cd downloads
          FILE=$(ls -t | head -1)
          BASENAME="${FILE%.*}"
          EXT="${FILE##*.}"
          
          split -b $(( ${{ github.event.inputs.chunk_size_mb }} * 1024 * 1024 )) -d "$FILE" "${BASENAME}.part"
          
          for f in ${BASENAME}.part*; do
            num=$(echo "$f" | grep -o '[0-9]*$')
            new_num=$(printf "%03d" $((10#$num + 1)))
            mv "$f" "${BASENAME}.${new_num}.${EXT}"
          done
          
          cd ..
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git commit -m "Download from ${{ github.event.inputs.url }}" || echo "No changes"
          git push