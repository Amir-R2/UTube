name: Smart Download with Split Cookies (5 Parts)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Enter URL (YouTube video or direct file)'
        required: true
        type: string
      quality:
        description: 'Video quality (for YouTube)'
        required: false
        type: choice
        default: 'best'
        options:
          - 'best'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'
          - 'bestaudio'
          - 'mp3'
      base_chunk_mb:
        description: 'Base chunk size in MB (auto-adjusts)'
        required: false
        type: string
        default: '50'
      output_folder:
        description: 'Output folder in repo'
        required: false
        type: string
        default: 'downloads'
      use_cookies:
        description: 'Use YouTube cookies? (requires COOKIES_PART1-5 secrets)'
        required: false
        type: boolean
        default: false

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Combine split cookies into one file (5 parts)
        if: github.event.inputs.use_cookies == 'true'
        run: |
          mkdir -p .github
          
          # Combine all five cookie parts
          echo "${{ secrets.COOKIES_PART1 }}" > .github/cookies.txt
          echo "${{ secrets.COOKIES_PART2 }}" >> .github/cookies.txt
          echo "${{ secrets.COOKIES_PART3 }}" >> .github/cookies.txt
          echo "${{ secrets.COOKIES_PART4 }}" >> .github/cookies.txt
          echo "${{ secrets.COOKIES_PART5 }}" >> .github/cookies.txt
          
          # Verify cookies file
          if [ -s .github/cookies.txt ]; then
            echo "✅ Cookies file created successfully from 5 parts"
            echo "Size: $(wc -c < .github/cookies.txt) bytes"
            echo "Lines: $(wc -l < .github/cookies.txt) lines"
          else
            echo "❌ Failed to create cookies file"
            exit 1
          fi

      - name: Download from URL
        run: |
          OUTPUT_DIR="${{ github.event.inputs.output_folder }}"
          mkdir -p "$OUTPUT_DIR"
          
          cd "$OUTPUT_DIR"
          
          if [[ "${{ github.event.inputs.url }}" =~ (youtube\.com|youtu\.be) ]]; then
            echo "📺 Downloading YouTube video..."
            
            QUALITY="${{ github.event.inputs.quality }}"
            
            if [ "$QUALITY" = "best" ]; then
              FORMAT="bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best"
            elif [ "$QUALITY" = "1080p" ]; then
              FORMAT="bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]"
            elif [ "$QUALITY" = "720p" ]; then
              FORMAT="bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]"
            elif [ "$QUALITY" = "480p" ]; then
              FORMAT="bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480][ext=mp4]"
            elif [ "$QUALITY" = "360p" ]; then
              FORMAT="bestvideo[height<=360][ext=mp4]+bestaudio[ext=m4a]/best[height<=360][ext=mp4]"
            elif [ "$QUALITY" = "bestaudio" ]; then
              FORMAT="bestaudio/best"
            elif [ "$QUALITY" = "mp3" ]; then
              FORMAT="bestaudio/best"
              EXTRACT_AUDIO="--extract-audio --audio-format mp3 --audio-quality 0"
            else
              FORMAT="bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best"
            fi
            
            # Download with or without cookies
            if [[ "${{ github.event.inputs.use_cookies }}" == "true" ]] && [[ -f "../.github/cookies.txt" ]]; then
              echo "🍪 Using cookies for download..."
              yt-dlp -f "$FORMAT" $EXTRACT_AUDIO \
                --cookies "../.github/cookies.txt" \
                --no-check-certificate \
                -o "%(title)s.%(ext)s" \
                "${{ github.event.inputs.url }}"
            else
              echo "🍪 Downloading without cookies..."
              yt-dlp -f "$FORMAT" $EXTRACT_AUDIO \
                -o "%(title)s.%(ext)s" \
                "${{ github.event.inputs.url }}"
            fi
            
          else
            echo "📁 Downloading direct file..."
            wget --no-check-certificate -O downloaded-file "${{ github.event.inputs.url }}"
          fi
          
          cd ../..
          echo "✅ Download complete"

      - name: Smart split file into chunks
        run: |
          BASE_CHUNK_MB=${{ github.event.inputs.base_chunk_mb }}
          OUTPUT_DIR="${{ github.event.inputs.output_folder }}"
          
          cd "$OUTPUT_DIR"
          
          # Find the downloaded file (exclude manifest and chunk files)
          DOWNLOADED_FILE=$(ls -t | grep -v manifest.txt | grep -v '.[0-9][0-9][0-9].' | head -1)
          
          if [[ -z "$DOWNLOADED_FILE" ]]; then
            echo "❌ No file found to split"
            exit 1
          fi
          
          BASENAME="${DOWNLOADED_FILE%.*}"
          EXTENSION="${DOWNLOADED_FILE##*.}"
          
          # Get file size in MB
          FILE_SIZE_BYTES=$(stat -c%s "$DOWNLOADED_FILE")
          FILE_SIZE_MB=$(echo "scale=2; $FILE_SIZE_BYTES / 1048576" | bc)
          FILE_SIZE_MB_INT=$(printf "%.0f" "$FILE_SIZE_MB")
          
          echo "========================================="
          echo "📦 File: $DOWNLOADED_FILE"
          echo "📏 Size: ${FILE_SIZE_MB} MB"
          echo "🎯 Base chunk size: ${BASE_CHUNK_MB} MB"
          echo "========================================="
          
          # Smart chunk size logic
          if [ $FILE_SIZE_MB_INT -le $BASE_CHUNK_MB ]; then
            # File is smaller than base chunk, don't split
            echo "✓ File is smaller than ${BASE_CHUNK_MB}MB, no splitting needed"
            cp "$DOWNLOADED_FILE" "${BASENAME}.001.${EXTENSION}"
            CHUNK_COUNT=1
            ACTUAL_CHUNK_SIZE=$FILE_SIZE_MB_INT
            # Remove original
            rm -f "$DOWNLOADED_FILE"
          else
            # Calculate optimal chunk size
            MIN_CHUNKS=3
            MAX_CHUNKS=10
            GITHUB_LIMIT_MB=95
            
            # Calculate ideal chunk size for 5 chunks
            IDEAL_CHUNK_SIZE=$(( $FILE_SIZE_MB_INT / 5 ))
            
            # Apply constraints
            if [ $IDEAL_CHUNK_SIZE -gt $GITHUB_LIMIT_MB ]; then
              # File is huge, use GitHub max limit
              CHUNK_SIZE=$GITHUB_LIMIT_MB
              CHUNK_COUNT=$(( ($FILE_SIZE_MB_INT + $CHUNK_SIZE - 1) / $CHUNK_SIZE ))
            elif [ $IDEAL_CHUNK_SIZE -lt $BASE_CHUNK_MB ]; then
              # File is medium, use base chunk size
              CHUNK_SIZE=$BASE_CHUNK_MB
              CHUNK_COUNT=$(( ($FILE_SIZE_MB_INT + $CHUNK_SIZE - 1) / $CHUNK_SIZE ))
            else
              # Use ideal chunk size
              CHUNK_SIZE=$IDEAL_CHUNK_SIZE
              CHUNK_COUNT=$(( ($FILE_SIZE_MB_INT + $CHUNK_SIZE - 1) / $CHUNK_SIZE ))
            fi
            
            # Ensure chunk count is reasonable
            if [ $CHUNK_COUNT -lt $MIN_CHUNKS ]; then
              CHUNK_SIZE=$(( $FILE_SIZE_MB_INT / $MIN_CHUNKS ))
              CHUNK_COUNT=$MIN_CHUNKS
            elif [ $CHUNK_COUNT -gt $MAX_CHUNKS ]; then
              CHUNK_SIZE=$(( $FILE_SIZE_MB_INT / $MAX_CHUNKS ))
              CHUNK_COUNT=$MAX_CHUNKS
            fi
            
            CHUNK_SIZE_BYTES=$(( $CHUNK_SIZE * 1024 * 1024 ))
            ACTUAL_CHUNK_SIZE=$CHUNK_SIZE
            
            echo "⚡ Smart splitting: ${FILE_SIZE_MB_INT}MB file into ${CHUNK_COUNT} chunks of ~${CHUNK_SIZE}MB each"
            
            split -b $CHUNK_SIZE_BYTES -d "$DOWNLOADED_FILE" "${BASENAME}.part"
            
            # Rename chunks with proper numbering
            for file in ${BASENAME}.part*; do
              if [[ -f "$file" ]]; then
                num=$(echo "$file" | grep -o '[0-9]*$')
                new_num=$(printf "%03d" $((10#$num + 1)))
                mv "$file" "${BASENAME}.${new_num}.${EXTENSION}"
              fi
            done
            
            # Remove original file after splitting
            rm -f "$DOWNLOADED_FILE"
          fi
          
          # Verify chunks
          ACTUAL_CHUNK_COUNT=$(ls -1 ${BASENAME}.[0-9][0-9][0-9].${EXTENSION} 2>/dev/null | wc -l)
          
          # Create manifest
          cat > manifest.txt << EOF
===========================================
📋 SMART DOWNLOAD MANIFEST
===========================================
URL: ${{ github.event.inputs.url }}
Quality: ${{ github.event.inputs.quality }}
Filename: $DOWNLOADED_FILE
Original Size: ${FILE_SIZE_MB} MB
Base Chunk Size: ${BASE_CHUNK_MB} MB
Actual Chunk Size: ${ACTUAL_CHUNK_SIZE} MB
Total Chunks: ${ACTUAL_CHUNK_COUNT}
Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
Cookies Used: ${{ github.event.inputs.use_cookies }}
Cookie Parts: 5
===========================================

🔧 To reassemble the file:
cat ${BASENAME}.[0-9][0-9][0-9].${EXTENSION} > $DOWNLOADED_FILE