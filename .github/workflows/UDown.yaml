name: Download, Split, and Push to Repo (with Cookies)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Enter URL (YouTube video, direct file, or any link)'
        required: true
        type: string
      quality:
        description: 'Video quality (for YouTube)'
        required: false
        type: choice
        default: 'best'
        options:
          - 'best (highest quality)'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'
          - 'bestaudio (best audio only)'
          - 'mp3 (convert to MP3)'
      chunk_size_mb:
        description: 'Chunk size in MB'
        required: false
        type: string
        default: '95'
      output_folder:
        description: 'Output folder in repo'
        required: false
        type: string
        default: 'downloads'

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Create cookies file from split secrets
        run: |
          mkdir -p .github
          # Combine the split cookie parts
          echo -n "${{ secrets.COOKIES_PART1 }}" > .github/cookies.txt
          echo -n "${{ secrets.COOKIES_PART2 }}" >> .github/cookies.txt
          # Add more if you have COOKIES_PART3, COOKIES_PART4 etc.
          
          echo "Cookies file created with size:"
          wc -c .github/cookies.txt
          wc -l .github/cookies.txt

      - name: Download from URL
        run: |
          OUTPUT_DIR="${{ github.event.inputs.output_folder }}"
          mkdir -p "$OUTPUT_DIR"
          
          cd "$OUTPUT_DIR"
          
          if [[ "${{ github.event.inputs.url }}" =~ (youtube\.com|youtu\.be) ]]; then
            echo "Downloading YouTube video with cookies..."
            
            QUALITY="${{ github.event.inputs.quality }}"
            
            if [ "$QUALITY" = "best (highest quality)" ]; then
              FORMAT="bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best"
            elif [ "$QUALITY" = "1080p" ]; then
              FORMAT="bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]"
            elif [ "$QUALITY" = "720p" ]; then
              FORMAT="bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]"
            elif [ "$QUALITY" = "480p" ]; then
              FORMAT="bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480][ext=mp4]"
            elif [ "$QUALITY" = "360p" ]; then
              FORMAT="bestvideo[height<=360][ext=mp4]+bestaudio[ext=m4a]/best[height<=360][ext=mp4]"
            elif [ "$QUALITY" = "bestaudio (best audio only)" ]; then
              FORMAT="bestaudio/best"
            elif [ "$QUALITY" = "mp3 (convert to MP3)" ]; then
              FORMAT="bestaudio/best"
              EXTRACT_AUDIO="--extract-audio --audio-format mp3 --audio-quality 0"
            else
              FORMAT="bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best"
            fi
            
            yt-dlp -f "$FORMAT" $EXTRACT_AUDIO \
              --cookies "../.github/cookies.txt" \
              -o "%(title)s.%(ext)s" \
              "${{ github.event.inputs.url }}"
            
          else
            echo "Downloading direct file..."
            wget -O downloaded-file "${{ github.event.inputs.url }}"
          fi
          
          cd ../..
          echo "Download complete"

      - name: Split file into chunks
        run: |
          CHUNK_SIZE=$(( ${{ github.event.inputs.chunk_size_mb }} * 1024 * 1024 ))
          OUTPUT_DIR="${{ github.event.inputs.output_folder }}"
          
          cd "$OUTPUT_DIR"
          
          DOWNLOADED_FILE=$(ls -t | grep -v manifest.txt | head -1)
          
          if [[ -z "$DOWNLOADED_FILE" ]]; then
            echo "No file found to split"
            exit 1
          fi
          
          echo "Splitting: $DOWNLOADED_FILE"
          
          BASENAME="${DOWNLOADED_FILE%.*}"
          EXTENSION="${DOWNLOADED_FILE##*.}"
          
          split -b $CHUNK_SIZE -d "$DOWNLOADED_FILE" "${BASENAME}.part"
          
          for file in ${BASENAME}.part*; do
            if [[ -f "$file" ]]; then
              num=$(echo "$file" | grep -o '[0-9]*$')
              new_num=$(printf "%03d" $((10#$num + 1)))
              mv "$file" "${BASENAME}.${new_num}.${EXTENSION}"
            fi
          done
          
          CHUNK_COUNT=$(ls -1 ${BASENAME}.[0-9][0-9][0-9].${EXTENSION} 2>/dev/null | wc -l)
          
          echo "URL: ${{ github.event.inputs.url }}" > manifest.txt
          echo "Quality: ${{ github.event.inputs.quality }}" >> manifest.txt
          echo "Filename: $DOWNLOADED_FILE" >> manifest.txt
          echo "Chunk Size: ${{ github.event.inputs.chunk_size_mb }} MB" >> manifest.txt
          echo "Total Chunks: $CHUNK_COUNT" >> manifest.txt
          echo "Date: $(date)" >> manifest.txt
          echo "" >> manifest.txt
          echo "To reassemble: cat ${BASENAME}.[0-9][0-9][0-9].${EXTENSION} > $DOWNLOADED_FILE" >> manifest.txt
          
          cat manifest.txt
          
          cd ../..

      - name: Push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "${{ github.event.inputs.output_folder }}/"
          git commit -m "Download: ${{ github.event.inputs.url }}" || echo "No changes to commit"
          git push